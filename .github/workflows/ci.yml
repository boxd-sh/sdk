# Public repo CI. This file is mirrored from sdk/ in the boxd monorepo; the
# monorepo does not run it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install uv
        run: pipx install uv==0.12.21
      - name: Install
        run: uv sync --extra dev --python ${{ matrix.python }}
      - name: Test
        run: uv run pytest
      - name: Stubs match proto/api.proto
        run: |
          bash scripts/compile_proto.sh
          git diff --exit-code -- src/boxd/_generated

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck && bun run typecheck:playground
      - name: Test
        run: bun test --timeout 180000 tests/
      - name: Stubs match proto/api.proto
        run: |
          bash scripts/compile_proto.sh
          git diff --exit-code -- src/_generated
