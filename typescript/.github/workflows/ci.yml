# Public repo CI. This file is mirrored from sdk/typescript/ in the boxd
# monorepo; the monorepo does not run it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck && bun run typecheck:playground
      - name: Test
        run: bun test --timeout 180000 tests/
      - name: Stubs match proto/api.proto
        run: |
          bash scripts/compile_proto.sh
          git diff --exit-code -- src/_generated
